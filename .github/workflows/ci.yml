name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          set -e
          shellcheck install.sh
          shellcheck lib/*.sh
          shellcheck pi-skill/extensions/*.sh
          shellcheck bin/megai

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify scripts parse
        run: |
          bash -n install.sh
          for f in lib/*.sh bin/megai pi-skill/extensions/*.sh; do
            bash -n "$f"
          done
