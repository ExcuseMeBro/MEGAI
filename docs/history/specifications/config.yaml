schema: spec-driven

context: |
  MEGAI is a Bash-based local coding-agent integration stack. Reuse existing installers and focused shell tests; avoid new daemons, dependencies beyond the requested tool, and mandatory planning for small fixes.
  Follow megai-openspec for selective spec work. The parent owns Plane and .todos boundaries; OpenSpec is not an orchestrator. Plane owns status, .todos one linked summary, tasks.md the detailed checklist. Preserve the linked project/work-item identity pair on resume.
  Keep agent handoff at Plane In Review in the started group; do not use a completion boolean for boundary states. Only the user may mark Done; archive and main promotion each require their own explicit user approval. These are separate actions.

rules:
  proposal:
    - Include the linked Plane project/work-item UUID pair, any historical source marker, bounded scope, non-goals and affected code paths.
  specs:
    - Define observable WHEN/THEN scenarios, preserved behavior and failure cases.
  design:
    - Reuse existing code and specify privacy, compatibility and rollback implications.
  tasks:
    - Reference requirements and their focused verification; keep this the only detailed checklist.

operations:
  apply:
    guidance:
      - Use one writer per checkout and scoped child evidence; no child task-tracker mutations.
      - Run actual focused tests; spec validation and planning completeness are not implementation proof.
  archive:
    guidance:
      - Require explicit user approval of this change plus passing verification and no unresolved critical findings.
      - Keep the Plane work item in started In Review; archive never authorizes Done or main promotion.
