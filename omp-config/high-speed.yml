providers:
  openai-codex:
    codeMode: auto
  maxInFlightRequests:
    openai-codex: 2
    minimax-code: 4

async:
  enabled: true

task:
  batch: true
  maxConcurrency: 6
  showResolvedModelBadge: true
  isolation:
    mode: auto
    merge: branch
    apply: true

retry:
  modelFallback: true
  maxDelayMs: 300000
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    "openai-codex/gpt-5.6-luna":
      - openai-codex/gpt-5.6-terra:medium
      - openai-codex/gpt-5.6-sol:high
    "openai-codex/gpt-5.6-terra":
      - openai-codex/gpt-5.6-sol:high
