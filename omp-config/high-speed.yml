providers:
  openai-codex:
    codeMode: auto
  maxInFlightRequests:
    openai-codex: 2
    minimax-code: 2

async:
  enabled: true
  maxJobs: 4

task:
  batch: true
  maxConcurrency: 4
  showResolvedModelBadge: true
  maxEffort: high
  softRequestBudget: 16
  maxRuntimeMs: 300000
  isolation:
    mode: auto
    merge: branch
    apply: true

goal:
  enabled: false

model:
  toolCallLoopGuard:
    threshold: 2

retry:
  modelFallback: true
  maxDelayMs: 30000
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    "openai-codex/gpt-5.6-luna": []
    "openai-codex/gpt-5.6-terra": []
    "openai-codex/gpt-5.6-sol": []
    "openai-codex/gpt-5.5": []
    "openai-codex/gpt-5.4": []
    "openai-codex/gpt-5.4-mini": []
    "openai-codex/gpt-5.3-codex-spark": []
