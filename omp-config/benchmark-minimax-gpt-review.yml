modelRoles:
  # MiniMax for implementation, GPT for review
  default: minimax-code/MiniMax-M3:high
  task: minimax-code/MiniMax-M3:high
  smol: minimax-code/MiniMax-M2.7-highspeed:medium
  tiny: minimax-code/MiniMax-M2.5-lightning:low
  commit: minimax-code/MiniMax-M2.5-lightning:low
  repo: minimax-code/MiniMax-M2.1-lightning:low
  worker-fast: minimax-code/MiniMax-M2.7-highspeed:medium
  worker-quality: minimax-code/MiniMax-M3:high
  tests: minimax-code/MiniMax-M2.7-highspeed:medium
  docker: minimax-code/MiniMax-M2.5-lightning:low
  migration: minimax-code/MiniMax-M2.5:medium
  worker-stable: minimax-code/MiniMax-M2.1:medium
  worker-legacy: minimax-code/MiniMax-M2:low

  # GPT for review roles only
  plan: openai-codex/gpt-5.6-sol:high
  slow: openai-codex/gpt-5.6-sol:high
  advisor: openai-codex/gpt-5.6-sol:high
  final: openai-codex/gpt-5.6-sol:high
  vision: openai-codex/gpt-5.6-sol:medium
  architecture: openai-codex/gpt-5.6-terra:high
  terra: openai-codex/gpt-5.6-terra:medium
  review: openai-codex/gpt-5.6-terra:high
  luna: openai-codex/gpt-5.6-luna:low
  scout: minimax-code/MiniMax-M2.1-lightning:low
  debug: openai-codex/gpt-5.5:high
  long-context: openai-codex/gpt-5.4:high
  review-fast: openai-codex/gpt-5.4-mini:medium
  trusted-fast: openai-codex/gpt-5.3-codex-spark:low

defaultThinkingLevel: high

advisor:
  enabled: false
  syncBacklog: off

task:
  agentAdvisor: {}
  agentModelOverrides:
    task: minimax-code/MiniMax-M3:high
    sonic: minimax-code/MiniMax-M2.5-lightning:low
    scout: minimax-code/MiniMax-M2.1-lightning:low
    cavecrew-investigator: minimax-code/MiniMax-M2.1-lightning:low
    cavecrew-builder: minimax-code/MiniMax-M2.7-highspeed:medium
    smart-router: minimax-code/MiniMax-M2.1-lightning:low
    gpt-core-worker: minimax-code/MiniMax-M3:high
    gpt-fast-worker: minimax-code/MiniMax-M2.7-highspeed:medium
    # Review roles use GPT
    reviewer: openai-codex/gpt-5.6-terra:high
    cavecrew-reviewer: openai-codex/gpt-5.4-mini:medium
    security-reviewer: openai-codex/gpt-5.6-sol:high
    librarian: openai-codex/gpt-5.4:high
    designer: openai-codex/gpt-5.6-sol:medium
    sol-gate: openai-codex/gpt-5.6-sol:high
    gpt-debugger: openai-codex/gpt-5.5:high
    gpt-long-context: openai-codex/gpt-5.4:high
    gpt-fast-reviewer: openai-codex/gpt-5.4-mini:medium
    gpt-trusted-fast: openai-codex/gpt-5.3-codex-spark:low

retry:
  fallbackChains:
    "minimax-code/MiniMax-M3":
      - openai-codex/gpt-5.6-luna:low
    "minimax-code/MiniMax-M2.7-highspeed":
      - openai-codex/gpt-5.4-mini:medium
    "minimax-code/MiniMax-M2.7":
      - openai-codex/gpt-5.4:high
    "minimax-code/MiniMax-M2.5-highspeed":
      - openai-codex/gpt-5.4-mini:medium
    "minimax-code/MiniMax-M2.5-lightning":
      - openai-codex/gpt-5.3-codex-spark:low
    "minimax-code/MiniMax-M2.5":
      - openai-codex/gpt-5.5:high
    "minimax-code/MiniMax-M2.1":
      - openai-codex/gpt-5.4:high
    "minimax-code/MiniMax-M2.1-lightning":
      - openai-codex/gpt-5.3-codex-spark:low
    "minimax-code/MiniMax-M2": []
