modelRoles:
  # GPT owns every write path; MiniMax is read-only discovery only.
  default: openai-codex/gpt-5.6-terra:medium
  task: openai-codex/gpt-5.6-terra:medium
  smol: openai-codex/gpt-5.4-mini:medium
  tiny: openai-codex/gpt-5.3-codex-spark:low
  commit: openai-codex/gpt-5.3-codex-spark:low
  repo: minimax-code/MiniMax-M2.1-lightning:low
  worker-fast: openai-codex/gpt-5.4-mini:medium
  worker-quality: openai-codex/gpt-5.6-terra:high
  tests: openai-codex/gpt-5.4-mini:medium
  docker: openai-codex/gpt-5.3-codex-spark:low
  migration: openai-codex/gpt-5.5:high
  worker-stable: openai-codex/gpt-5.4:high
  worker-legacy: openai-codex/gpt-5.3-codex-spark:low

  # Explicit GPT specialties
  plan: openai-codex/gpt-5.6-sol:high
  slow: openai-codex/gpt-5.6-sol:high
  advisor: openai-codex/gpt-5.6-sol:high
  final: openai-codex/gpt-5.6-sol:high
  vision: openai-codex/gpt-5.6-sol:medium
  architecture: openai-codex/gpt-5.6-terra:high
  terra: openai-codex/gpt-5.6-terra:medium
  review: openai-codex/gpt-5.6-terra:high
  luna: openai-codex/gpt-5.6-luna:low
  scout: minimax-code/MiniMax-M2.1-lightning:low
  debug: openai-codex/gpt-5.5:high
  long-context: openai-codex/gpt-5.4:high
  review-fast: openai-codex/gpt-5.4-mini:medium
  trusted-fast: openai-codex/gpt-5.3-codex-spark:low

defaultThinkingLevel: medium

advisor:
  enabled: false
  syncBacklog: off

task:
  agentAdvisor: {}
  agentModelOverrides:
    task: openai-codex/gpt-5.6-terra:medium
    sonic: openai-codex/gpt-5.3-codex-spark:low
    scout: minimax-code/MiniMax-M2.1-lightning:low
    cavecrew-investigator: minimax-code/MiniMax-M2.1-lightning:low
    cavecrew-builder: openai-codex/gpt-5.4-mini:medium
    smart-router: minimax-code/MiniMax-M2.1-lightning:low
    gpt-core-worker: openai-codex/gpt-5.6-terra:medium
    gpt-fast-worker: openai-codex/gpt-5.4-mini:medium
    # Retired MiniMax writer names are forced to GPT if referenced by stale sessions.
    minimax-worker: openai-codex/gpt-5.6-terra:medium
    minimax-fast-worker: openai-codex/gpt-5.4-mini:medium
    minimax-quality-worker: openai-codex/gpt-5.6-terra:high
    minimax-test-worker: openai-codex/gpt-5.4-mini:medium
    minimax-ops-worker: openai-codex/gpt-5.3-codex-spark:low
    minimax-migration-worker: openai-codex/gpt-5.5:high
    minimax-stable-worker: openai-codex/gpt-5.4:high
    minimax-legacy-worker: openai-codex/gpt-5.3-codex-spark:low
    minimax-commit-writer: openai-codex/gpt-5.3-codex-spark:low
    luna-scout: openai-codex/gpt-5.6-luna:low
    terra-scout: openai-codex/gpt-5.6-terra:medium
    reviewer: openai-codex/gpt-5.6-terra:high
    cavecrew-reviewer: openai-codex/gpt-5.4-mini:medium
    security-reviewer: openai-codex/gpt-5.6-sol:high
    librarian: openai-codex/gpt-5.4:high
    designer: openai-codex/gpt-5.6-sol:medium
    sol-gate: openai-codex/gpt-5.6-sol:high
    gpt-debugger: openai-codex/gpt-5.5:high
    gpt-long-context: openai-codex/gpt-5.4:high
    gpt-fast-reviewer: openai-codex/gpt-5.4-mini:medium
    gpt-trusted-fast: openai-codex/gpt-5.3-codex-spark:low

retry:
  fallbackChains:
    "minimax-code/MiniMax-M2.1-lightning":
      - openai-codex/gpt-5.6-luna:low
    "minimax-code/MiniMax-M3": []
    "minimax-code/MiniMax-M2.7-highspeed": []
    "minimax-code/MiniMax-M2.7": []
    "minimax-code/MiniMax-M2.5-highspeed": []
    "minimax-code/MiniMax-M2.5-lightning": []
    "minimax-code/MiniMax-M2.5": []
    "minimax-code/MiniMax-M2.1": []
    "minimax-code/MiniMax-M2": []
